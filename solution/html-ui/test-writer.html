<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Tests</title>
  <script>
    const tests = [];

    function addStep() {
      const name = document.getElementById('name').value;
      const description = document.getElementById('description').value;
      if (name) {
        tests.push({ name, description, subSteps: [] });
        renderSteps();
      }
      save();
    }

    function renderSteps() {
      const stepsContainer = document.getElementById('stepsContainer');
      stepsContainer.innerHTML = tests
        .map((step, index) => `<li>${step.name} - ${step.description}</li>`)
        .join('');
    }

    function exportToJSON() {
      const jsonOutput = JSON.stringify(tests, null, 2);
      const blob = new Blob([jsonOutput], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tests.json';
      a.click();
    }

    function save() {
      let stringifiedTests = JSON.stringify(tests);
      localStorage.setItem('tests', stringifiedTests);
      console.log('Tests saved to localStorage.');
      
      document.getElementById('jsonOutput').value = stringifiedTests;
    }

  function load() {
      const savedTests = localStorage.getItem('tests');
      if (savedTests) {
        document.getElementById('jsonOutput').value = savedTests;
        const loadedTests = JSON.parse(savedTests);
        tests.length = 0;
        tests.push(...loadedTests);
        renderSteps();
        console.log('Tests loaded from localStorage.');
      } else {
        console.log('No tests found in localStorage.');
      }
    }

    function loadFromJSON() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = event => {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = e => {
          const content = e.target.result;
          const loadedTests = JSON.parse(content);
          tests.length = 0;
          tests.push(...loadedTests);
          renderSteps();
        };
        reader.readAsText(file);
      };
      input.click()
    }

    window.addEventListener('storage', event => {
      if (event.key === 'tests') {
        load();
      }
    });
  </script>
</head>
<body>
  <div class="container"></div>
    <h1>Test Generator</h1>
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" id="name" class="form-control" />
    </div>
    <div class="form-group">
      <label for="description">Description:</label>
      <textarea id="description" class="form-control"></textarea>
    </div>
    <button class="btn btn-primary" onclick="addStep()">Add Test</button>
    <ul id="stepsContainer" class="list-group mt-3"></ul>
    <div class="mt-3">
      <button class="btn btn-success" onclick="exportToJSON()">Export to JSON</button>
      <button class="btn btn-info" onclick="loadFromJSON()">Load Exported</button>
      <button class="btn btn-warning" onclick="save()">Save</button>
      <button class="btn btn-secondary" onclick="load()">Load</button>
    </div>
    <div class="form-group mt-3">
      <label for="jsonOutput">JSON:</label>
      <textarea id="jsonOutput" class="form-control"></textarea>
    </div>
  </div>
  <style>
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-control {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
    }
    .btn {
      margin-right: 10px;
      padding: 10px 15px;
      border: none;
      cursor: pointer;
    }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-success { background-color: #28a745; color: white; }
    .btn-info { background-color: #17a2b8; color: white; }
    .btn-warning { background-color: #ffc107; color: black; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .list-group {
      list-style-type: none;
      padding: 0;
    }
    .list-group li {
      padding: 10px;
      border: 1px solid #ddd;
      margin-bottom: 5px;
    }
    .mt-3 {
      margin-top: 15px;
    }
  </style>
</body>
</html>
